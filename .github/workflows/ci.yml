# Kept inside GitHub's free allowance for private repositories: a push runs only the Linux
# jobs (macOS minutes cost about ten times as much); the macOS jobs and fuzzing run for pull
# requests into main and when started by hand (Actions -> CI -> Run workflow).
# The whole of this file also runs on your own machine, for free: scripts/ci-local.sh.
name: CI

on:
  push:
    branches: [main, v1]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install bubblewrap (the Linux sandbox runner)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          bwrap --unshare-all --ro-bind / / true && echo "bwrap works" || echo "bwrap does NOT work here"
      - name: Linux install script parses
        if: runner.os == 'Linux'
        run: sh -n packaging/linux/install.sh
      - name: Test image for the container runner (the runner itself never downloads)
        if: runner.os == 'Linux'
        run: docker pull -q alpine:3.20
      - run: cargo test --workspace
        env:
          # The sandbox and (on Linux, where runners have Docker) container hostile tests must
          # run, never skip, in CI.
          GMC_REQUIRE_SANDBOX: "1"
          GMC_REQUIRE_DOCKER: ${{ runner.os == 'Linux' && '1' || '0' }}
          # Discovery over loopback multicast works on the macOS runners.
          GMC_REQUIRE_MDNS: ${{ runner.os == 'macOS' && '1' || '0' }}
      # The test-only unsandboxed executor must never be part of a shipped build.
      - name: Shipped binaries exclude the insecure test executor
        shell: bash
        run: |
          if cargo tree -q -p gimmecores-cli -e normal,build,features | grep -q insecure-test-executor; then
            echo "insecure-test-executor is enabled in the shipped dependency graph" >&2
            exit 1
          fi

  python:
    name: Python SDK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap (the lender's sandbox in the tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - run: cargo build -p gimmecores-cli
      - uses: astral-sh/setup-uv@v6
      - name: Generated stubs match spec/proto
        working-directory: python
        run: ./scripts/gen_proto.sh && git diff --exit-code -- src/gimmecores/_proto
      - name: Python image for the container tests (the runner itself never downloads)
        if: runner.os == 'Linux'
        run: docker pull -q python:3.12-slim
      - name: Tests against two real daemons
        working-directory: python
        # Python 3.11 here, so it differs from the lender's: a pool that built packages for
        # this device instead of the lender would fail the targeting tests.
        run: uv run --python 3.11 --group dev pytest -q
        env:
          GMC_BIN_DIR: ${{ github.workspace }}/target/debug
          GMC_REQUIRE_DISTINCT_PYTHON: "1"
          GMC_REQUIRE_CONTAINER: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Trusted mode tests, with the Python the lender's sandbox runs
        working-directory: python
        run: |
          # Ask the lender's sandbox which Python it runs, then test with that same one.
          GMC_LENDER_PYTHON_OUT="$RUNNER_TEMP/lender-python" uv run --group dev pytest -q tests/test_trusted.py -k report_the_lenders_python
          PY="$(cat "$RUNNER_TEMP/lender-python")"
          echo "lender Python: $PY ($("$PY" --version))"
          UV_PROJECT_ENVIRONMENT=.venv-lender uv run --python "$PY" --group dev pytest -q tests/test_trusted.py
        env:
          GMC_BIN_DIR: ${{ github.workspace }}/target/debug
          GMC_REQUIRE_TRUSTED: "1"

  fuzz:
    name: fuzz decoders (60 s per target)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Seed inputs (a signed grant cannot be found by mutation alone)
        run: cargo test -p gimmecores-node --test fuzz_smoke write_fuzz_seeds -- --ignored
      - name: Every target that decodes bytes another device controls
        run: |
          for t in $(cargo fuzz list); do
            echo "::group::$t"
            cargo fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 14

  deps:
    name: dependency policy (advisories, licences, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  desktop:
    name: desktop app (macOS)
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: The shipped app excludes the insecure test executor
        run: |
          if cargo tree -q -e normal,build,features | grep -q insecure-test-executor; then
            echo "insecure-test-executor is enabled in the app's shipped dependency graph" >&2
            exit 1
          fi
      - name: Build GimmeCores.app and .dmg (ad-hoc signed)
        working-directory: .
        run: ./packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GimmeCores-macos
          path: dist/GimmeCores.dmg
          retention-days: 7

  desktop-deps:
    name: desktop app dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/desktop/Cargo.toml
