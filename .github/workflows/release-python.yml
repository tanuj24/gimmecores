# Publishes the Python SDK to PyPI with Trusted Publishing (OIDC): no long-lived token exists
# anywhere. Runs only for a tag like `py-v0.1.0` that matches the package version, and only
# after a maintainer approves the `pypi` environment (set "Required reviewers" on it).
#
# One-time setup (by the project owner, not automated):
#   1. On pypi.org, add a trusted publisher for project `gimmecores`: owner tanuj24, repository
#      gimmecores, workflow release-python.yml, environment pypi.
#   2. In the GitHub repository settings, create the `pypi` environment with required reviewers.
# Third-party actions are pinned to exact commits (this job can publish).
name: release (Python SDK)

on:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: The tag matches the package version
        working-directory: python
        run: |
          version="$(uv run --no-project python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "py-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != py-v$version"; exit 1; }
      - name: Generated stubs match spec/proto
        working-directory: python
        run: ./scripts/gen_proto.sh && git diff --exit-code -- src/gimmecores/_proto
      - name: Build the sdist and wheel
        working-directory: python
        run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: python/dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # Trusted Publishing (OIDC) and build attestations
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
