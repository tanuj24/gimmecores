# Builds release binaries for a tag like `v0.1.0` and attaches them, with SHA-256 checksums, a
# CycloneDX SBOM and signed build provenance (GitHub attestations: Sigstore, keyless, tied to
# this workflow), to a DRAFT GitHub release. Nothing is published until a maintainer reviews
# and publishes the draft. Anyone can check a download with:
#   gh attestation verify gimmecores-<target>.tar.gz --repo tanuj24/gimmecores
# Third-party actions are pinned to exact commits (these jobs can sign and publish).
# The macOS app is ad-hoc signed (no Apple Developer ID yet). Its update archive is signed with
# the update key by the maintainer (scripts/release-mac.sh), who also publishes the draft.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write       # signing the provenance (Sigstore, keyless)
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Build (locked dependencies)
        run: cargo build --release --locked -p gimmecores-cli
      - name: Package
        run: |
          name="gimmecores-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/gmc target/release/gmcd target/release/gimmecores LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - name: SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          # One SBOM per crate; the CLI's covers everything in the binaries.
          cargo cyclonedx --format json --override-filename sbom
          cp crates/gimmecores-cli/sbom.json "dist/gimmecores-${{ matrix.target }}.sbom.json"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  macos-app:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # GMC_RELEASE: refuses to build without the update key's public half (the app trusts it)
      # or with test options. The update archive is signed later by the maintainer, on their
      # own Mac (scripts/release-mac.sh checks this provenance first); never here.
      - run: GMC_RELEASE=1 ./packaging/macos/build-app.sh
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/GimmeCores.dmg
            dist/GimmeCores.app.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-macos-app
          path: |
            dist/GimmeCores.dmg
            dist/GimmeCores.app.tar.gz

  draft:
    needs: [build, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the draft release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Draft release (a maintainer reviews and publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "GimmeCores $GITHUB_REF_NAME" \
            --notes "Binaries with checksums (SHA256SUMS), CycloneDX SBOMs and signed build provenance (gh attestation verify <file> --repo $GITHUB_REPOSITORY). The macOS app is ad-hoc signed; its update is signed with the GimmeCores update key."
