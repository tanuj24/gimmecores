// GimmeCores peer protocol, version 1 (draft, M0).
//
// Transport: iroh QUIC connections, ALPN "gimmecores/peer/1". Both endpoints are authenticated by
// their Ed25519 public keys (the TLS identity). Each exchange uses one bidirectional QUIC stream
// carrying length-prefixed (u32 big-endian) PeerMessage frames. Max frame size: 4 MiB; larger
// payloads (blobs) are chunked.
//
// Authorization (enforced by the receiver, see docs/design/threat-model.md):
//   * Unpaired key: only Hello and Pair* messages, only while pairing mode is open.
//   * Paired key:   Hello, LinkTest*, Grant*, Unpair.
//   * Paired key with an ACTIVE grant issued by the receiver to the sender: Blob*, Task*.
//     Blobs are namespaced per borrower (FindMissingBlobs / BlobGet only see that borrower's
//     blobs) and count against the grant's disk quota (invariant I14).

syntax = "proto3";

package gimmecores.peer.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

message PeerMessage {
  oneof body {
    Hello hello = 1;

    PairRequest pair_request = 10;
    PairChallenge pair_challenge = 11;
    PairReveal pair_reveal = 12;
    PairConfirm pair_confirm = 13;
    Unpair unpair = 14;

    LinkTestRequest link_test_request = 20;
    LinkTestResponse link_test_response = 21;

    GrantRequest grant_request = 30;
    GrantOffer grant_offer = 31;       // lender → borrower: proposed or final grant
    GrantAccept grant_accept = 32;     // borrower accepts an offer that changed the limits
    GrantDecline grant_decline = 33;
    GrantRevoke grant_revoke = 34;     // either side
    GrantStateChanged grant_state = 35;

    FindMissingBlobs find_missing = 40;
    MissingBlobs missing = 41;
    BlobChunk blob_chunk = 42;
    BlobGet blob_get = 43;

    SubmitTask submit_task = 50;
    TaskEvent task_event = 51;
    CancelTask cancel_task = 52;

    Error error = 99;
  }
}

// ---------------------------------------------------------------- identity / capabilities

message Hello {
  uint32 protocol_version = 1;   // 1
  string software_version = 2;   // e.g. "0.1.0"
  string device_name = 3;        // user-chosen; max 64 UTF-8 chars; display as plain text
  Capabilities capabilities = 4; // sent only to paired peers
}

message Capabilities {
  string os = 1;                 // "macos" | "linux" | "windows"
  string arch = 2;               // "arm64" | "x86_64"
  uint32 cpu_cores = 3;
  uint64 memory_bytes = 4;
  repeated Gpu gpus = 5;
  repeated string container_runtimes = 6; // "docker", "podman"
  bool native_mode_available = 7;
  bool on_battery = 8;
  bool lending_enabled = 9;
  repeated ExecutionMode lend_modes = 10;       // what the lender chose to lend
  repeated ExecutionMode available_modes = 11;  // what works on this machine right now (probed)
}

message Gpu {
  GpuKind kind = 1;
  string name = 2;
  uint64 memory_bytes = 3;
}

enum GpuKind {
  GPU_KIND_UNSPECIFIED = 0;
  GPU_KIND_NONE = 1;
  GPU_KIND_CUDA = 2;
  GPU_KIND_METAL = 3;
}

// ---------------------------------------------------------------- pairing (docs/design/pairing.md)

message PairRequest {
  bytes commitment = 1;          // SHA-256("gimmecores-pair-commit-v1" || nA), 32 bytes
  string device_name = 2;
}

message PairChallenge {
  bytes nonce = 1;               // nB, 32 bytes
  string device_name = 2;
}

message PairReveal {
  bytes nonce = 1;               // nA, 32 bytes
}

message PairConfirm {
  bool accepted = 1;             // true only after the local user confirmed the 6-digit code
}

message Unpair {
  string reason = 1;
}

// ---------------------------------------------------------------- link test

// One mode per stream, chosen by the first request's id (see gimmecores-node linktest.rs):
//   0 = ping (immediate empty reply), 1 = upload (reply carries bytes received in `id`),
//   2 = download (payload = big-endian u64 byte count to stream back, max 64 MiB).
message LinkTestRequest {
  uint64 id = 1;
  bytes payload = 2;             // empty for RTT probes; up to 1 MiB for throughput chunks
  bool echo_payload = 3;
}

message LinkTestResponse {
  uint64 id = 1;
  bytes payload = 2;
}

// ---------------------------------------------------------------- grants (docs/design/consent-and-grants.md)

message Limits {
  uint32 cpu_millis = 1;         // 1000 = one core
  uint64 memory_bytes = 2;       // hard cap, no swap
  uint64 disk_bytes = 3;
  GpuKind gpu = 4;
  uint32 max_concurrent_tasks = 5;
}

enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_CONTAINER = 1;  // container runtime (Docker or compatible)
  EXECUTION_MODE_NATIVE = 2;     // as the lender's user, no sandbox (own devices, opt-in)
  EXECUTION_MODE_SANDBOX = 3;    // the OS sandbox, no runtime; uses the lender's installed tools
}

enum NetworkPolicy {
  NETWORK_POLICY_UNSPECIFIED = 0;
  NETWORK_POLICY_NONE = 1;
  NETWORK_POLICY_INTERNET = 2;   // internet egress only; lender LAN and localhost blocked
}

enum Schedule {
  SCHEDULE_UNSPECIFIED = 0;
  SCHEDULE_ALWAYS = 1;
  SCHEDULE_IDLE_ONLY = 2;
}

enum TrustLevel {
  TRUST_LEVEL_UNSPECIFIED = 0;
  TRUST_LEVEL_STANDARD = 1;
  TRUST_LEVEL_TRUSTED = 2;       // requires Trusted mode enabled on both devices
}

message GrantRequest {
  bytes request_id = 1;          // 16 random bytes
  Limits limits = 2;
  repeated ExecutionMode modes = 3;
  NetworkPolicy network = 4;
  google.protobuf.Duration duration = 5;
  TrustLevel trust = 6;
  string reason = 7;             // free text shown to the lender; max 280 chars
}

message Grant {
  bytes grant_id = 1;            // 16 random bytes
  bytes lender_key = 2;          // Ed25519 public key, 32 bytes
  bytes borrower_key = 3;
  google.protobuf.Timestamp issued_at = 4;
  google.protobuf.Timestamp not_after = 5;
  Limits limits = 6;
  repeated ExecutionMode modes = 7;
  NetworkPolicy network = 8;
  bool env_build_network = 9;
  Schedule schedule = 10;
  bool pause_on_battery = 11;
  bool pause_when_hot = 12;
  TrustLevel trust = 13;
  bytes request_id = 14;
}

// Protobuf encoding is not canonical across implementations, so the signature covers the exact
// serialized bytes that are transmitted; receivers verify `grant` before decoding it.
message SignedGrant {
  bytes grant = 1;               // serialized Grant
  bytes signature = 2;           // Ed25519 by lender_key over "gimmecores-grant-v1" || grant
}

message GrantOffer {
  SignedGrant grant = 1;
  bool final = 2;                // true: already ACTIVE; false: limits changed, needs GrantAccept
}

message GrantAccept { bytes grant_id = 1; }
message GrantDecline { bytes request_id = 1; string reason = 2; }
message GrantRevoke { bytes grant_id = 1; string reason = 2; }

enum GrantState {
  GRANT_STATE_UNSPECIFIED = 0;
  GRANT_STATE_REQUESTED = 1;
  GRANT_STATE_OFFERED = 2;
  GRANT_STATE_ACTIVE = 3;
  GRANT_STATE_PAUSED = 4;
  GRANT_STATE_EXPIRED = 5;
  GRANT_STATE_REVOKED = 6;
  GRANT_STATE_DECLINED = 7;
}

message GrantStateChanged {
  bytes grant_id = 1;
  GrantState state = 2;
  string reason = 3;             // e.g. "lender active", "on battery"
}

// ---------------------------------------------------------------- content-addressed blobs

enum DigestFunction {
  DIGEST_FUNCTION_UNSPECIFIED = 0;
  DIGEST_FUNCTION_SHA256 = 1;
}

message Digest {
  bytes hash = 1;                // 32 bytes
  uint64 size_bytes = 2;         // receiver rejects data whose size does not match
  DigestFunction function = 3;
}

// A directory is itself stored as a blob (deterministically encoded Directory message).
message Directory {
  repeated FileNode files = 1;   // sorted by name
  repeated DirectoryNode directories = 2; // sorted by name
}

message FileNode {
  // Single path component. Rejected: "", ".", "..", "/", "\", NUL, control characters,
  // Windows reserved names (CON, NUL, COM1…), trailing dot/space, and names that collide
  // case-insensitively with a sibling (macOS/Windows filesystems).
  string name = 1;
  Digest digest = 2;
  bool executable = 3;
}

message DirectoryNode {
  string name = 1;
  Digest digest = 2;             // digest of the child Directory blob
}
// Symlinks are not supported in v1 (prevents escapes); they are resolved or rejected at upload.

// Every blob message names the grant it belongs to (I14: active grant required; the blobs count
// against that grant's disk quota; namespaces are per borrower).
message FindMissingBlobs { repeated Digest digests = 1; bytes grant_id = 2; }
message MissingBlobs { repeated Digest digests = 1; }

message BlobChunk {
  Digest digest = 1;
  uint64 offset = 2;
  bytes data = 3;                // up to 1 MiB
  bool last = 4;
  bytes grant_id = 5;
}

message BlobGet {
  Digest digest = 1;
  uint64 offset = 2;
  bytes grant_id = 3;
}

// ---------------------------------------------------------------- tasks

message Environment {
  oneof kind {
    ImageEnv image = 1;
    LockfileEnv lockfile = 2;
    NativeEnv native = 3;
  }
}

message ImageEnv {
  string reference = 1;          // display only
  string digest = 2;             // "sha256:…" — what actually runs
}

message LockfileEnv {
  string kind = 1;               // "uv" | "poetry" | "pip" | "npm" | …
  Digest lockfile = 2;
  string interpreter = 3;        // e.g. "python3.12"
  bool offline = 4;              // dependencies shipped as blobs; no network at build time
  repeated Digest bundled_packages = 5;
}

message NativeEnv {
  string os = 1;
  string arch = 2;
  map<string, string> tools = 3; // e.g. {"python": "3.12"}
}

enum Serialization {
  SERIALIZATION_UNSPECIFIED = 0;
  SERIALIZATION_JSON = 1;
  SERIALIZATION_MSGPACK = 2;
  SERIALIZATION_ARROW_IPC = 3;
  SERIALIZATION_NPY = 4;              // loaded with allow_pickle=False
  SERIALIZATION_CLOUDPICKLE = 5;      // Trusted mode only
}

message CallSpec {
  string entry_point = 1;        // "module:function"
  Digest arguments = 2;          // batch of argument tuples
  Serialization serialization = 3;
  uint32 batch_size = 4;
}

message Command {
  repeated string argv = 1;      // never passed through a shell by GimmeCores
  string working_directory = 2;  // relative to the input root
  map<string, string> environment = 3; // only explicitly declared variables
}

message SubmitTask {
  bytes task_id = 1;             // 16 random bytes; single use
  bytes grant_id = 2;
  ExecutionMode mode = 3;
  Environment env = 4;
  oneof work {
    Command command = 5;
    CallSpec call = 6;
  }
  Digest input_root = 7;         // Directory blob
  repeated string output_paths = 8;
  Limits limits = 9;             // must fit within the grant
  NetworkPolicy network = 10;    // must be allowed by the grant
  google.protobuf.Duration timeout = 11;
  // The borrower shows the lender's figures while the task runs: the lender then sends
  // TaskEvent.usage about every 2 s. Unset (older borrowers): it sends none.
  bool report_usage = 12;
}

message TaskEvent {
  bytes task_id = 1;
  oneof event {
    Queued queued = 2;
    Started started = 3;
    LogChunk log = 4;
    TaskResult finished = 5;
    // Only when SubmitTask.report_usage was set; at most about one every 2 s. The lender's
    // claim: the borrower bounds every figure and shows it as the lender's report.
    TaskUsage usage = 6;
  }
}

message Queued { string reason = 1; }
message Started { google.protobuf.Timestamp at = 1; bool warm = 2; }

message LogChunk {
  enum Stream { STREAM_UNSPECIFIED = 0; STREAM_STDOUT = 1; STREAM_STDERR = 2; }
  Stream stream = 1;
  bytes data = 2;
}

message ResourceUsage {
  google.protobuf.Duration wall = 1;
  google.protobuf.Duration cpu = 2;
  uint64 peak_memory_bytes = 3;
  uint64 bytes_in = 4;
  uint64 bytes_out = 5;
}

message RemoteError {
  string type = 1;               // e.g. "ValueError"
  string message = 2;
  string traceback = 3;          // text only
}

message TaskResult {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SUCCEEDED = 1;
    STATUS_FAILED = 2;           // non-zero exit or exception
    STATUS_TIMED_OUT = 3;
    STATUS_CANCELLED = 4;
    STATUS_REVOKED = 5;          // grant revoked/expired while running
    STATUS_LIMIT_EXCEEDED = 6;   // memory/disk/pids cap hit
    STATUS_REJECTED = 7;         // failed authorization or validation; never started
  }
  Status status = 1;
  int32 exit_code = 2;
  Digest output_root = 3;        // Directory blob
  Digest return_values = 4;      // for CallSpec tasks
  // Set by the lender, therefore untrusted: the borrower decodes return_values ONLY with the
  // serialization it requested in CallSpec, and treats any mismatch as an error (invariant I6).
  Serialization serialization = 5;
  RemoteError error = 6;
  ResourceUsage usage = 7;
  // Why it ended, as the lender saw it (absent from older lenders). The lender's claim.
  EndCause cause = 8;
  // The lender's last figures for the task (absent from older lenders). The lender's claim.
  TaskUsage final_usage = 9;
}

// How the lender's system schedules its service, and so every task it runs.
enum ServiceSpeed {
  SERVICE_SPEED_UNSPECIFIED = 0;   // not reported (an older lender). Never shown as normal
  SERVICE_SPEED_NORMAL = 1;        // the system does not hold the lender's service back
  SERVICE_SPEED_REDUCED = 2;       // below normal priority: work on several cores runs about half as fast
  SERVICE_SPEED_BACKGROUND = 3;    // background priority: efficiency cores only, several times slower
}

// Where a task's figures come from.
enum UsageSource {
  USAGE_SOURCE_UNSPECIFIED = 0;       // not reported
  USAGE_SOURCE_NONE = 1;              // this runner measures nothing
  USAGE_SOURCE_PROCESS_TREE = 2;      // sandbox: the task's processes, sampled
  USAGE_SOURCE_CONTAINER_STATS = 3;   // the container runtime's own figures
}

// Why the lender paused lending.
enum PauseCause {
  PAUSE_CAUSE_UNSPECIFIED = 0;
  PAUSE_CAUSE_ON_BATTERY = 1;
  PAUSE_CAUSE_HOT = 2;
  PAUSE_CAUSE_OWNER_ACTIVE = 3;
  PAUSE_CAUSE_OTHER = 4;
}

// The lender's own measurements of one task: numbers and enums only. Every value is the
// lender's claim (threat model T2): display only. An absent optional figure was NOT
// MEASURED; it is not zero.
message TaskUsage {
  enum State {
    STATE_UNSPECIFIED = 0; STATE_RUNNING = 1; STATE_FROZEN = 2;
    STATE_STOPPING = 3; STATE_COLLECTING = 4;
  }
  State state = 1;
  PauseCause frozen_why = 2;
  optional uint32 cpu_millis_now = 3;      // 1000 = one core
  optional uint64 cpu_time_ms = 4;
  optional uint64 memory_bytes = 5;
  optional uint64 memory_peak_bytes = 6;   // highest sample
  optional uint64 disk_bytes = 7;          // the task's folder
  optional uint32 processes = 8;
  uint64 run_ms = 9;                       // since the command started, lender's clock
  uint64 frozen_ms = 10;                   // of which frozen by a pause
  ServiceSpeed speed = 11;
}

// Why a task ended, as the lender saw it.
enum EndCause {
  END_CAUSE_UNSPECIFIED = 0;         // older lender: the wording comes from the status alone
  END_CAUSE_EXITED = 1;
  END_CAUSE_TIMEOUT = 2;             // the task's own time limit
  END_CAUSE_GRANT_EXPIRED = 3;
  END_CAUSE_GRANT_REVOKED = 4;
  END_CAUSE_LENDING_OFF = 5;
  END_CAUSE_UNPAIRED = 6;
  END_CAUSE_TRUST_ENDED = 7;
  END_CAUSE_OWNER_STOPPED = 8;       // the lender's owner stopped this one task
  END_CAUSE_PAUSED_TOO_LONG = 9;
  END_CAUSE_MEMORY_LIMIT = 10;
  END_CAUSE_DISK_LIMIT = 11;
  END_CAUSE_BORROWER_CANCELLED = 12;
  END_CAUSE_BORROWER_GONE = 13;      // seen on the lender only
  END_CAUSE_REFUSED = 14;            // never admitted
  END_CAUSE_RUNNER_ERROR = 15;       // admitted; the command could not be started
  END_CAUSE_OUTPUT_ERROR = 16;       // the command ran; its results could not be stored
  END_CAUSE_SERVICE_STOPPING = 17;   // the lender's service was stopped
}

message CancelTask { bytes task_id = 1; }

// ---------------------------------------------------------------- errors

message Error {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_NOT_PAIRED = 1;
    CODE_PAIRING_CLOSED = 2;
    CODE_NO_GRANT = 3;
    CODE_GRANT_INACTIVE = 4;
    CODE_EXCEEDS_GRANT = 5;
    CODE_INVALID = 6;
    CODE_RATE_LIMITED = 7;
    CODE_UNSUPPORTED_VERSION = 8;
    CODE_INTERNAL = 9;
  }
  Code code = 1;
  string message = 2;
}
