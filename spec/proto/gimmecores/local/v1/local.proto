// GimmeCores local control API, version 1 (draft, M0).
//
// Served by gmcd on the same machine only, as two services on two separate endpoints so that
// code that submits work can never reach consent actions (threat model I13):
//
//   Client  — SDKs, `gmc run`, scripts.        socket: <runtime_dir>/gimmecores/client.sock
//   Control — dashboard, desktop app, interactive  socket: <runtime_dir>/gimmecores/control.sock
//             CLI commands (pair, grants, rules).
//
//   * macOS/Linux: gRPC over Unix domain sockets, mode 0600, owned by the user.
//   * Windows:     gRPC over named pipes with an ACL for the current user only.
//   * Dashboard:   JSON gateway on 127.0.0.1 with session token, Host and Origin checks.
//
// Control calls marked [presence] require OS-verified user presence (Touch ID / password,
// Windows Hello, polkit) at the moment of the call. Calls that only reduce access never do.
// SDKs never open network connections themselves.

syntax = "proto3";

package gimmecores.local.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "gimmecores/peer/v1/peer.proto";

service Client {
  rpc GetStatus(GetStatusRequest) returns (Status);
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);         // paired + discovered
  rpc LinkTest(LinkTestRequest) returns (LinkStats);
  rpc RequestGrant(RequestGrantRequest) returns (GrantInfo);           // as borrower; the lender decides
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
  rpc PlanJob(JobSpec) returns (JobPlan);                              // dry run: peers, bytes to upload, estimates
  rpc SubmitJob(JobSpec) returns (stream JobEvent);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  // Reduce-only: a client may always stop lending (e.g. a "panic" script).
  rpc StopAllLending(StopAllLendingRequest) returns (Status);
}

service Control {
  // Device and discovery
  rpc SetLending(SetLendingRequest) returns (Status);                  // [presence] when enabling
  rpc SetDiscovery(SetDiscoveryRequest) returns (Status);              // [presence] for EVERYONE_10_MIN
  rpc SetPresence(SetPresenceRequest) returns (Status);                // [presence] to turn off, when this device can verify it
  rpc SetShareLoad(SetShareLoadRequest) returns (Status);              // [presence] to turn on
  rpc SetTaskSpeed(SetTaskSpeedRequest) returns (Status);              // [presence] when faster
  rpc SetLendModes(SetLendModesRequest) returns (Status);              // [presence] when adding a mode
  rpc WatchEvents(WatchEventsRequest) returns (stream Event);          // requests, grant changes, activity

  // Pairing
  rpc OpenPairing(OpenPairingRequest) returns (OpenPairingResponse);   // 2-minute window
  rpc StartPairing(StartPairingRequest) returns (PairingSession);      // to a discovered or manual address
  rpc ConfirmPairing(ConfirmPairingRequest) returns (PairingSession);  // [presence] after comparing codes
  rpc ListPairings(ListPairingsRequest) returns (ListPairingsResponse);
  rpc Unpair(UnpairRequest) returns (Peer);
  rpc SetTrustedMode(SetTrustedModeRequest) returns (Peer);            // [presence] when enabling

  // Grants (as lender)
  rpc RespondToGrant(RespondToGrantRequest) returns (GrantInfo);       // [presence] for accept / edit
  rpc RevokeGrant(RevokeGrantRequest) returns (GrantInfo);
  rpc AddRule(AddRuleRequest) returns (Rule);                          // [presence]
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc RemoveRule(RemoveRuleRequest) returns (Rule);

  // Audit
  rpc QueryAudit(QueryAuditRequest) returns (stream AuditEntry);

  // Activity: what runs here for other devices, with what it asked for and what it uses, and
  // what ran recently. Read-only, no presence. Served on Control only: rows carry command text
  // other devices chose, which scripts, SDKs and AI agents (Client socket) never see.
  rpc ListActivity(ListActivityRequest) returns (Activity);
  // Reduce-only: stops one task running here for another device. Never asks for presence.
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);
}

message StopAllLendingRequest { string reason = 1; }

// ---------------------------------------------------------------- status / discovery

message GetStatusRequest {}

enum DiscoveryMode {
  DISCOVERY_MODE_UNSPECIFIED = 0;
  DISCOVERY_MODE_OFF = 1;
  DISCOVERY_MODE_PAIRED_ONLY = 2;      // default
  DISCOVERY_MODE_EVERYONE_10_MIN = 3;  // not settable: opening pairing mode advertises this device while open
}

message Status {
  string device_name = 1;
  string fingerprint = 2;
  bool lending_enabled = 3;
  DiscoveryMode discovery = 4;
  gimmecores.peer.v1.Capabilities capabilities = 5;
  uint32 active_lent_tasks = 6;
  uint32 active_borrowed_tasks = 7;
  string pause_reason = 8;     // non-empty while laptop protections pause lending
  bool idle_only = 9;
  bool pause_on_battery = 10;
  bool presence_required = 11; // I13: consent actions need Touch ID / password / polkit
  string presence_method = 12;
  repeated gimmecores.peer.v1.ExecutionMode lend_modes = 13;       // chosen by this user
  repeated gimmecores.peer.v1.ExecutionMode available_modes = 14;  // work on this machine
  bool pause_when_hot = 15;    // lending pauses while the computer is hot (default)
  string identity_store = 16;  // where this device's identity key is kept, for display
  // Non-empty while the system holds this service back, so tasks run slower here than this
  // computer can (macOS: started as a background job, which gets only the efficiency cores).
  // Says what to do about it.
  string performance_note = 17;
  // Devices holding a live grant from this one may see how busy this whole computer is (CPU,
  // memory, GPUs: every program, the owner's own included). Off unless the owner turns it on.
  bool share_load = 18;
  // How tasks from other devices are scheduled here, for grants that name no speed.
  gimmecores.peer.v1.TaskSpeed task_speed = 19;
  // The running service's version and build, e.g. "0.1.1 (943d37b 2026-11-16)". Empty from
  // services older than this field.
  string version = 20;
  // Set when the program this service runs from is no longer on disk (the app or package was
  // removed while it ran): the path it started from. Empty otherwise.
  string program_removed = 21;
}

message SetLendingRequest {
  bool enabled = 1;
  bool idle_only = 2;          // lend only while the owner is away from the keyboard
  bool allow_on_battery = 3;   // default false: lending pauses on battery
  bool allow_when_hot = 4;     // default false: lending pauses while the computer is hot
}
message SetDiscoveryRequest { DiscoveryMode mode = 1; }
// Which ways of running tasks this device lends. Adding one needs presence; removing one never
// does. Grants already given keep only the modes still lent: tasks in a withdrawn mode are
// refused from then on (running ones finish).
message SetLendModesRequest { repeated gimmecores.peer.v1.ExecutionMode modes = 1; }

// Turning presence off is meant for machines that cannot show a prompt (servers, Pis). Where
// the OS can verify presence, turning it off needs presence too. Always audited.
message SetPresenceRequest { bool required = 1; }
// Turning it on needs presence; turning it off never does. Always audited.
message SetShareLoadRequest { bool enabled = 1; }
// A faster level needs presence; a slower one never does. Always audited.
message SetTaskSpeedRequest { gimmecores.peer.v1.TaskSpeed speed = 1; }

message Peer {
  string fingerprint = 1;
  string device_name = 2;
  bool paired = 3;
  bool trusted_mode_local = 4;         // enabled on this device
  bool trusted_mode_remote = 5;        // enabled on the peer
  bool online = 6;
  gimmecores.peer.v1.Capabilities capabilities = 7;
  repeated LinkStats links = 8;
  google.protobuf.Timestamp paired_at = 9;
  google.protobuf.Timestamp trusted_until = 10;   // when trusted_mode_local lapses (30 days)
  // The version the device last said it runs (learned on a grant request or link test, in
  // either direction), and when. Empty until then; a claim, for display.
  string software_version = 11;
  google.protobuf.Timestamp version_seen = 12;
}

message ListPeersRequest { bool include_discovered = 1; }
message ListPeersResponse { repeated Peer peers = 1; }

message WatchEventsRequest {}

// Sent when something changes: a pairing session, a grant (a new request included), a peer's
// use of this machine, or this device's own status (lending on/off, paused, ...). Nothing is
// sent for the state at the moment of subscribing: read it with the List calls first.
message Event {
  oneof kind {
    PairingSession pairing = 1;
    GrantInfo grant = 2;
    ActivityUpdate activity = 3;
    Status status = 4;
    // Something in the activity listing changed (a task started, ended or changed phase):
    // read it again with ListActivity. Never sent for figures alone.
    ActivityChanged activity_changed = 5;
  }
}

message ActivityChanged { uint64 revision = 1; }

message ActivityUpdate {
  string peer_fingerprint = 1;
  bool lending = 2;                    // true: peer is using this machine
  uint32 running_tasks = 3;
  uint32 cpu_millis_used = 4;
  uint64 memory_bytes_used = 5;
}

// ---------------------------------------------------------------- pairing

message OpenPairingRequest {}
message OpenPairingResponse {
  google.protobuf.Timestamp closes_at = 1;
  // Pairing ticket for manual pairing without discovery: "gmc1:<public-key-hex>@<ip:port>[,<ip:port>…]".
  // It contains only public information; the 6-digit code comparison still protects pairing.
  string ticket = 2;
}

message ListPairingsRequest {}
message ListPairingsResponse { repeated PairingSession sessions = 1; }

message StartPairingRequest {
  oneof target {
    string peer_fingerprint = 1;       // from discovery
    string ticket = 2;                 // pairing ticket from the other device (see OpenPairingResponse)
  }
}

message PairingSession {
  bytes session_id = 1;                // 8-byte big-endian session number
  string peer_device_name = 2;
  string peer_fingerprint = 3;
  string code = 4;                     // 6 digits, once both nonces are exchanged
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_WAITING = 1;
    STATE_COMPARE_CODE = 2;
    STATE_PAIRED = 3;
    STATE_FAILED = 4;
  }
  State state = 5;
  string error = 6;
  bool name_previously_seen_with_other_key = 7;   // warning
}

message ConfirmPairingRequest { bytes session_id = 1; bool codes_match = 2; }
message UnpairRequest { string peer_fingerprint = 1; }
message SetTrustedModeRequest { string peer_fingerprint = 1; bool enabled = 2; bool warning_acknowledged = 3; }

// ---------------------------------------------------------------- link test

message LinkTestRequest { string peer_fingerprint = 1; }

message LinkStats {
  string interface_kind = 1;           // "wifi" | "ethernet" | "thunderbolt" | "usb4" | "other"
  google.protobuf.Duration rtt_min = 2;
  google.protobuf.Duration rtt_median = 3;
  google.protobuf.Duration rtt_p95 = 4;
  uint64 upload_bits_per_second = 5;   // encrypted, as experienced
  uint64 download_bits_per_second = 6;
  google.protobuf.Timestamp measured_at = 7;
  repeated string good_for = 8;        // e.g. ["builds", "tests", "containers"]
}

// ---------------------------------------------------------------- grants

message RequestGrantRequest {
  string peer_fingerprint = 1;
  gimmecores.peer.v1.GrantRequest request = 2;
}

message GrantInfo {
  bytes grant_id = 1;
  bytes request_id = 2;
  string peer_fingerprint = 3;
  bool as_lender = 4;
  gimmecores.peer.v1.GrantState state = 5;
  gimmecores.peer.v1.Grant grant = 6;     // decoded, after signature verification
  string state_reason = 7;
}

message ListGrantsRequest { bool include_inactive = 1; }
message ListGrantsResponse { repeated GrantInfo grants = 1; }

message RespondToGrantRequest {
  bytes grant_id = 1;                  // from GrantInfo of the pending request
  enum Decision { DECISION_UNSPECIFIED = 0; DECISION_ACCEPT = 1; DECISION_DECLINE = 2; }
  Decision decision = 2;
  gimmecores.peer.v1.Grant edited = 3;    // optional: lender-edited limits (becomes an offer)
}

message RevokeGrantRequest { bytes grant_id = 1; string reason = 2; }

message Rule {
  bytes rule_id = 1;
  string peer_fingerprint = 2;
  gimmecores.peer.v1.Limits max_limits = 3;
  gimmecores.peer.v1.Schedule schedule = 4;
  string daily_until = 5;              // "18:00", local time
  google.protobuf.Timestamp expires_at = 6;
}

message AddRuleRequest { Rule rule = 1; }
message ListRulesRequest {}
message ListRulesResponse { repeated Rule rules = 1; }
message RemoveRuleRequest { bytes rule_id = 1; }

// ---------------------------------------------------------------- jobs

message JobSpec {
  string project_root = 1;             // absolute path on this machine
  string manifest_path = 2;            // gmc.toml, or empty when tasks are given inline
  repeated string task_names = 3;      // from the manifest
  repeated InlineTask inline_tasks = 4; // from SDKs
  bool trusted = 5;                    // SDK requested Trusted mode
  repeated string confirmed_sensitive_paths = 6;  // user confirmed sending these
}

message InlineTask {
  string name = 1;
  gimmecores.peer.v1.Environment env = 2;
  oneof work {
    gimmecores.peer.v1.Command command = 3;
    gimmecores.peer.v1.CallSpec call = 4;
  }
  repeated string inputs = 5;
  repeated string excludes = 6;
  repeated string outputs = 7;
  gimmecores.peer.v1.Limits resources = 8;
  gimmecores.peer.v1.NetworkPolicy network = 9;
  google.protobuf.Duration timeout = 10;
  uint32 retry = 11;
  bool local_fallback = 12;
  repeated string peers = 13;
  uint32 shards = 14;
  // Where to run on the lender. Unspecified: container if an image is given, else sandbox.
  gimmecores.peer.v1.ExecutionMode mode = 15;
  // Files the SDK adds to the inputs (its worker's payload), under `.gmc-sdk/`. Not written
  // into the project; at most 64 MiB in all.
  repeated InlineFile files = 16;
  // Local files or folders the SDK sends under `.gmc-sdk/` (installed packages, files passed as
  // arguments), read from disk like the project. Not written into the project.
  repeated Attachment attachments = 17;
  // Absolute folder on this machine where declared outputs are written (default: the project
  // folder). Created if missing.
  string output_dir = 18;
  // A slower level than the grant's for these tasks (unspecified: the grant's). The lender
  // takes the slower of the two (docs/design/task-speed.md).
  gimmecores.peer.v1.TaskSpeed speed = 19;
  // Only name the image, never send it from this device's Docker even when the grant allows.
  // False (the CLI, the SDK and `gmc mcp`): send it when the grant allows.
  bool name_image_only = 20;
}

message Attachment {
  string local_path = 1;               // absolute path on this machine
  string path = 2;                     // where it appears on the lender, under .gmc-sdk/
  // An installed-packages folder: files matching their package's RECORD hash are sent as
  // they are; every other file gets the default excludes and the secret scan.
  bool packages = 3;
}

message InlineFile {
  string path = 1;                     // relative, under .gmc-sdk/
  bytes data = 2;
}

message JobPlan {
  repeated PlannedTask tasks = 1;
  repeated string warnings = 2;        // e.g. secret pattern found, tasks too small for Wi-Fi
  repeated string sensitive_paths = 3; // need explicit confirmation before submit
}

message PlannedTask {
  string name = 1;
  string peer_fingerprint = 2;         // empty = local
  uint64 bytes_to_upload = 3;
  google.protobuf.Duration estimated_transfer = 4;
}

message JobEvent {
  bytes job_id = 1;
  string task_name = 2;
  string peer_fingerprint = 3;
  oneof event {
    gimmecores.peer.v1.TaskEvent task = 4;
    string rescheduled = 5;            // reason
    JobDone done = 6;
  }
}

message JobDone {
  uint32 succeeded = 1;
  uint32 failed = 2;
  string output_directory = 3;
  // Set only for a Trusted job, by this device's daemon (never by the lender): Trusted mode
  // with that lender was on here, under a Trusted grant, from submission to the end. Only then
  // may an SDK decode the lender's results with pickle (threat model I6, section 6).
  bool trusted_results = 4;
}

message CancelJobRequest { bytes job_id = 1; }
message CancelJobResponse {}

// ---------------------------------------------------------------- audit

message QueryAuditRequest {
  google.protobuf.Timestamp since = 1;
  string peer_fingerprint = 2;
}

message AuditEntry {
  uint64 sequence = 1;
  google.protobuf.Timestamp at = 2;
  string kind = 3;                     // "pair", "unpair", "trust", "grant", "task", "rule", "lending"
  string peer_fingerprint = 4;
  string summary = 5;                  // human-readable
  bytes details = 6;                   // JSON
  bytes previous_hash = 7;             // hash chain
  bytes hash = 8;
}

// ---------------------------------------------------------------- activity

// The revision of the listing the caller already holds, or 0 (reserved: today every reply is
// complete).
message ListActivityRequest {
  uint64 known_revision = 1;
  // Also this device's own tasks running on other devices (DIRECTION_THERE rows) and the
  // per-grant figures in Activity.borrowed. Unset (older clients): only rows of tasks
  // running on this computer, as before.
  bool include_there = 2;
}
message StopTaskRequest { bytes task_id = 1; }
message StopTaskResponse {}

enum Direction { DIRECTION_UNSPECIFIED = 0; DIRECTION_HERE = 1; DIRECTION_THERE = 2; }

enum ExecPhase {
  EXEC_PHASE_UNSPECIFIED = 0;
  EXEC_PHASE_PREPARING = 1;    // there: checking files, connecting. here: unpacking
  EXEC_PHASE_UPLOADING = 2;    // there only
  EXEC_PHASE_WAITING = 3;      // there only: sent, the lender has not started it
  EXEC_PHASE_STARTING = 4;     // here only: the runner was asked, no process yet
  EXEC_PHASE_RUNNING = 5;
  EXEC_PHASE_FROZEN = 6;       // here only: frozen here, confirmed by the runner
  EXEC_PHASE_STOPPING = 7;     // a stop was asked for and has not finished
  EXEC_PHASE_COLLECTING = 8;   // here: storing results. there: fetching them
  EXEC_PHASE_ENDED = 9;
}

// Every optional figure: absent means "not measured".
message Usage {
  optional uint32 cpu_millis_now = 1;
  optional uint64 cpu_time_ms = 2;
  optional uint64 memory_bytes = 3;
  optional uint64 memory_peak_bytes = 4;
  optional uint64 disk_bytes = 5;
  optional uint32 processes = 6;
  uint64 run_ms = 7;                 // this device's clock
  uint64 frozen_ms = 8;
  bool reported_by_peer = 9;         // true for DIRECTION_THERE: the lender's claim
  gimmecores.peer.v1.PauseCause frozen_why = 12;
  gimmecores.peer.v1.UsageSource source = 13;
  gimmecores.peer.v1.ServiceSpeed speed = 14;   // HERE: this device's own
  gimmecores.peer.v1.TaskSpeed task_speed = 15; // the level it runs at (THERE: as reported)
  bool task_speed_applied = 16;                 // false: its runner cannot apply levels
}

message Asked {
  uint32 cpu_millis = 1;
  uint64 memory_bytes = 2;
  google.protobuf.Duration timeout = 3;
  google.protobuf.Duration effective_timeout = 4;  // min(asked, time left on the grant); unset: not known yet
  bool defaults = 5;                 // the daemon's 1 core / 1 GiB, not chosen by the user
  bool cpu_limit_enforced = 6;       // container: capped. sandbox: monitored only
}

message Ending {
  gimmecores.peer.v1.TaskResult.Status status = 1;
  gimmecores.peer.v1.EndCause cause = 2;
  optional sint32 exit_code = 3;
  string message = 4;                // at most 200 escaped characters
  google.protobuf.Timestamp ended_at = 8;
}

message Execution {
  bytes id = 1;                      // 16 bytes, the same on both devices
  Direction direction = 2;
  string peer_fingerprint = 3;
  string peer_name = 4;
  bytes grant_id = 5;
  bytes group = 6;                   // 8 bytes, computed by this daemon
  string label = 7;                  // at most 64 characters; may be empty
  repeated string argv = 8;          // at most 12, each at most 64 characters, escaped, likely secrets hidden
  uint32 argv_total = 9;
  uint32 argv_hidden = 10;           // arguments replaced because they look like secrets
  bool argv_cut = 11;
  repeated string env_names = 12;    // names only, at most 8
  uint32 env_total = 13;
  string image = 14;
  gimmecores.peer.v1.ExecutionMode mode = 15;
  Asked asked = 16;
  gimmecores.peer.v1.Limits grant_limits = 17;
  google.protobuf.Timestamp grant_not_after = 18;
  ExecPhase phase = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp started_at = 21;   // this device's clock; unset: no process yet
  Usage usage = 22;
  Ending ending = 23;                // set when phase is ENDED
  bool can_stop = 26;                // HERE: StopTask applies
}

// Finished executions of one kind (same device, command, way of running): 240 calls of one
// function are one group, and a failure is never hidden inside it.
message ExecutionGroup {
  bytes group = 1;
  Direction direction = 2;
  string peer_fingerprint = 3;
  string peer_name = 4;
  uint32 count = 5;
  uint32 succeeded = 6;
  uint32 failed = 7;                 // non-zero exit
  uint32 stopped = 8;                // timed out, cancelled, revoked, over a limit
  uint32 not_run = 9;                // could not start, results not stored
  google.protobuf.Timestamp first_at = 10;
  google.protobuf.Timestamp last_at = 11;
  optional uint64 cpu_time_ms_total = 12;
  uint32 cpu_measured_runs = 13;     // how many of `count` had CPU time measured
  uint64 run_ms_total = 14;
  uint64 frozen_ms_total = 15;
  optional uint64 memory_peak_bytes_max = 16;
  gimmecores.peer.v1.ServiceSpeed slowest_speed = 17;
  Execution last = 18;
  Execution last_problem = 19;       // the most recent that did not exit 0
}

message Activity {
  uint64 revision = 1;                 // never 0; changes when a row appears, ends or changes phase
  google.protobuf.Timestamp since = 3; // when this daemon started: history begins here
  repeated Execution running = 4;      // not ended; at most 64 per direction, oldest first
  uint32 running_here_omitted = 5;
  repeated ExecutionGroup recent = 7;  // newest first; at most 8 per device per direction
  MachineLoad machine = 8;             // this computer as a whole, measured for this listing
  repeated BorrowedLoad borrowed = 9;  // with include_there: each grant this device holds
}

// What this device's tasks use on one lender, as that lender reports (bounded by this device:
// memory and disk at most the grant's, CPU at most a fixed ceiling). Summed over every task
// running there, not only the rows listed.
message BorrowedLoad {
  bytes grant_id = 1;
  string peer_fingerprint = 2;
  string peer_name = 3;
  gimmecores.peer.v1.Limits grant_limits = 4;
  uint32 tasks = 5;                      // this device's tasks there now, in any phase
  uint32 running = 6;                    // of which the lender said it started
  // Sums over the running ones; absent if any of them has no recent report (an older lender,
  // a runner that measures nothing, or reports that stopped arriving).
  optional uint32 cpu_millis = 7;
  optional uint64 memory_bytes = 8;
  // The lender's whole computer, if its owner shares it: absent until asked (the first
  // listing asks), from an older lender, or when the answer is too old.
  LenderLoad lender = 9;
}

// The lender's whole computer as it last reported (bounded by this device).
message LenderLoad {
  bool shared = 1;                       // false: its owner does not share it
  uint32 cpu_cores = 2;
  optional uint32 cpu_busy_millis = 3;
  uint64 memory_total_bytes = 4;
  optional uint64 memory_used_bytes = 5;
  repeated GpuLoad gpus = 6;
  uint64 age_ms = 7;                     // how long ago the answer arrived
}

// This computer as a whole, measured when the listing is read (never in the background).
// Every optional figure: absent means "not measured".
message MachineLoad {
  uint32 cpu_cores = 1;
  optional uint32 cpu_busy_millis = 2;   // every program, this service and its tasks included
  optional uint32 lent_cpu_millis = 3;   // tasks from other devices; absent if any of them is not measured
  uint64 memory_total_bytes = 4;
  optional uint64 memory_used_bytes = 5; // total minus what the system says is available
  optional uint64 lent_memory_bytes = 6; // as lent_cpu_millis
  repeated GpuLoad gpus = 7;
}

message GpuLoad {
  string name = 1;                       // at most 64 characters, control characters removed
  gimmecores.peer.v1.GpuKind kind = 2;
  uint64 memory_bytes = 3;               // its own memory; 0: shares the system's, or not known
  optional uint32 busy_percent = 4;
}
