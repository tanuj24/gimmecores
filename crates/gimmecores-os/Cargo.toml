[package]
name = "gimmecores-os"
version = "0.1.0"
description = "Owner-only local IPC and private files for GimmeCores, on macOS, Linux and Windows"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "time", "fs", "io-util", "macros"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.9"

[target.'cfg(windows)'.dependencies]
getrandom = "0.4.3"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }

# Not the workspace lints: Windows' access-control and pipe calls need `unsafe`, allowed only
# inside `windows.rs` (as `gimmecores-presence` does for macOS).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
