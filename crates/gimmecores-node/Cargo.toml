[package]
name = "gimmecores-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
getrandom = "0.4.3"
gimmecores-client = { version = "0.1.0", path = "../gimmecores-client" }
gimmecores-core = { version = "0.1.0", path = "../gimmecores-core" }
gimmecores-net = { version = "0.1.0", path = "../gimmecores-net" }
gimmecores-presence = { version = "0.1.0", path = "../gimmecores-presence" }
gimmecores-proto = { version = "0.1.0", path = "../gimmecores-proto" }
globset = "0.4.21"
hex = "0.4.3"
if-addrs = "0.15.0"
ignore = "0.4.34"
mdns-sd = { version = "0.21.7", default-features = false, features = ["async"] }
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
prost = "0.14.5"
prost-types = "0.14.5"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-util = "0.7.20"
tonic = "0.14.9"
tracing = "0.1.44"

[features]
# Runs tasks as plain local processes with NO sandbox, and allows a fixed (fake) user-presence
# answer. Test-only: enabled solely through the dev-dependency below, so normal and release
# builds cannot contain either.
insecure-test-executor = []

[lints]
workspace = true

[dev-dependencies]
prost-types = "0.14.5"
gimmecores-node = { path = ".", features = ["insecure-test-executor"] }
tempfile = "3.27.0"
