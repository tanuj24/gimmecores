[package]
name = "gimmecores-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
getrandom = "0.4.3"
gimmecores-core = { version = "0.1.0", path = "../gimmecores-core" }
gimmecores-net = { version = "0.1.0", path = "../gimmecores-net" }
gimmecores-proto = { version = "0.1.0", path = "../gimmecores-proto" }
globset = "0.4.21"
hex = "0.4.3"
ignore = "0.4.34"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
prost = "0.14.5"
prost-types = "0.14.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
