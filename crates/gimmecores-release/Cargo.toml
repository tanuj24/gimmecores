[package]
name = "gimmecores-release"
version = "0.1.1"
description = "Signs GimmeCores app updates on the maintainer's own machine (never in CI)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gmc-release"
path = "src/main.rs"

# Throwaway, unencrypted keys for scripts/test-self-update.sh only; never a release key.
[[example]]
name = "sign-for-tests"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
gimmecores-bundle = { path = "../gimmecores-bundle" }
minisign = "0.10.0"
serde_json = "1.0.154"

[dev-dependencies]
minisign-verify = "0.3.0"
tempfile = "3.27.0"

[lints]
workspace = true
