[package]
name = "gimmecores-presence"
version = "0.1.0"
description = "OS-verified user presence (Touch ID / password, polkit) for GimmeCores consent actions"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1.54.1", features = ["process", "sync", "time", "macros", "rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }

# Not the workspace lints: this is the one crate allowed to call platform APIs through `unsafe`,
# and only inside `macos.rs`, behind `#[allow(unsafe_code)]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
