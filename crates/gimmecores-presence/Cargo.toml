[package]
name = "gimmecores-presence"
version = "0.1.0"
description = "OS-verified user presence (Touch ID / password, polkit, Windows Hello / password) for GimmeCores consent actions"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1.54.1", features = ["process", "sync", "time", "macros", "rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError", "NSProcessInfo"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_Registry", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.3.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }

# Not the workspace lints: platform APIs need `unsafe`, allowed only inside `macos.rs` and
# `windows.rs`, behind `#[allow(unsafe_code)]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
