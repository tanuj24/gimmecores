[package]
name = "gimmecores-client"
version = "0.1.1"
description = "Connects to a local gmcd over its owner-only sockets (CLI, desktop app, SDKs)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
gimmecores-os = { version = "0.1.1", path = "../gimmecores-os" }
gimmecores-proto = { version = "0.1.1", path = "../gimmecores-proto" }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["net"] }
tonic = "0.14.9"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
