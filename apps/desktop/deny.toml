# Dependency policy for the desktop app (its own workspace). Mirrors /deny.toml.
# Dependency policy, checked in CI with `cargo deny check`.

[graph]
all-features = false
# Only the platforms GimmeCores ships for (browser/WebAssembly-only dependencies are excluded).
# The desktop app ships on macOS first. Tauri's Linux stack (gtk-rs 0.18, zbus) currently
# carries "unmaintained" advisories (RUSTSEC-2024-0370 and zbus/zvariant); add the Linux
# targets back, and review those advisories, when the Linux desktop build lands.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
# Known vulnerabilities and unmaintained crates fail the build, except documented exceptions.
yanked = "deny"
ignore = [
    # `paste` is unmaintained (not vulnerable). It is a compile-time macro used by netlink crates
    # that iroh needs for Linux network-interface monitoring. Revisit when iroh updates them.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, compile-time only, transitive via iroh" },
]

[licenses]
# Permissive licences compatible with distributing GimmeCores under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
