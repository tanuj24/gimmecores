# Dependency policy for the desktop app (its own workspace). Mirrors /deny.toml.
# Dependency policy, checked in CI with `cargo deny check`.

[graph]
all-features = false
# Only the platforms GimmeCores ships for (browser/WebAssembly-only dependencies are excluded).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# Known vulnerabilities and unmaintained crates fail the build, except documented exceptions.
yanked = "deny"
ignore = [
    # `paste` is unmaintained (not vulnerable). It is a compile-time macro used by netlink crates
    # that iroh needs for Linux network-interface monitoring. Revisit when iroh updates them.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, compile-time only, transitive via iroh" },
    # Linux only, reviewed 2026-11-13: "unmaintained", no known vulnerability.
    # proc-macro-error: a compile-time macro helper in gtk-rs's glib-macros (via Tauri/wry).
    { id = "RUSTSEC-2024-0370", reason = "unmaintained, compile-time only, transitive via Tauri's GTK stack" },
    # zbus_names / zvariant / zvariant_derive were merged into zbus 6; Tauri's Linux stack still
    # uses zbus 5, where they remain the working implementation. Revisit when Tauri moves on.
    { id = "RUSTSEC-2026-0370", reason = "merged into zbus 6, still functional; transitive via Tauri (Linux)" },
    { id = "RUSTSEC-2026-0371", reason = "merged into zbus 6, still functional; transitive via Tauri (Linux)" },
    { id = "RUSTSEC-2026-0372", reason = "merged into zbus 6, still functional; transitive via Tauri (Linux)" },
    # Not listed because cargo deny does not flag it (an "unsound" note on a transitive crate),
    # but GitHub's Dependabot does: RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g, glib's
    # VariantStrIter. It is fixed only in glib 0.20, and Tauri's GTK 3 stack (Linux) needs 0.18.
    # Reviewed 2026-11-15: its only entry point, Variant::array_iter_str, is called by none of
    # the 21 crates here that depend on glib, nor by the app. Recheck when Tauri updates GTK.
]

[licenses]
# Permissive licences compatible with distributing GimmeCores under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
