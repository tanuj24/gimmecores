[project]
name = "gimmecores"
version = "0.1.0"
description = "Run Python functions on your other devices' spare cores, with their owner's consent"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["grpcio>=1.66", "protobuf>=5.27.2,<8"]

[project.optional-dependencies]
# Trusted mode (lambdas, notebooks): functions and results travel as pickles.
trusted = ["cloudpickle>=3"]
# Packages from the project's lockfile, installed for the lender on this device.
envs = ["uv>=0.5"]

[project.urls]
Repository = "https://github.com/tanuj24/gimmecores"

[dependency-groups]
dev = [
  # Python 3.10 or later for the test and stub tools: pytest before 9.0.3 relies on predictable
  # /tmp/pytest-of-{user} folders (CVE-2025-71176), and grpcio-tools brings setuptools, whose
  # fixes (83 and 84.1) also need 3.10. The SDK itself still supports 3.9: Apple's developer
  # tools install Python 3.9 as a Mac's python3, which a lender may run.
  "pytest>=9.0.3; python_version >= '3.10'",
  "grpcio-tools>=1.66,<1.67; python_version >= '3.10'",
  "cloudpickle>=3", "uv>=0.5", "joblib>=1.3",
  # The official MCP client, to test `gmc mcp` against an implementation that is not ours.
  "mcp>=2.3; python_version >= '3.10'",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gimmecores"]

[tool.hatch.build.targets.sdist]
# Exactly what is published: never local virtual environments or caches.
include = ["/src", "/tests", "/scripts", "/README.md", "/pyproject.toml"]
exclude = ["__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
